[project]
name = "cubercard"
version = "0.1.2"
description = "Cuber Card agent kit: CLI for creating and maintaining Cuber Card flashcards over the API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "zstandard>=0.22",
]

[project.scripts]
cubercard = "cubercard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubercard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
